<svg width="980" height="700" viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Tahoma, Verdana, Arial, sans-serif">
  <title>coderev Desktop — Retro (2000s) theme</title>
  <desc>Illustration of the coderev desktop application in its Retro theme, styled after early-2000s Windows applications: beige surfaces, beveled 3D buttons, square corners and classic blue tab selection.</desc>

  <rect x="0" y="0" width="980" height="700" fill="#ECE9D8"/>
  <rect x="0.5" y="0.5" width="979" height="699" fill="none" stroke="#ACA899" stroke-width="1"/>

  <!-- Header -->
  <g>
    <path d="M28 24 h5 l7 12 h-5 z M31 20 l9 4 l-4 9 l-9 -4 z" fill="#2DA44E"/>
    <text x="52" y="34" font-size="15" font-weight="700" fill="#000000">coderev</text>

    <!-- beveled icon buttons -->
    <g>
      <rect x="726" y="16" width="26" height="24" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M726.5 39.5 h25 M750.5 16.5 v24" stroke="#404040" stroke-width="1"/>
      <path d="M727.5 38.5 h24 M749.5 17.5 v22" stroke="#808080" stroke-width="1"/>
      <path d="M739 22 v12 M733 28 h12" stroke="#000000" stroke-width="1.5"/>

      <rect x="758" y="16" width="26" height="24" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M758.5 39.5 h25 M782.5 16.5 v24" stroke="#404040" stroke-width="1"/>
      <path d="M759.5 38.5 h24 M781.5 17.5 v22" stroke="#808080" stroke-width="1"/>
      <circle cx="771" cy="28" r="6" fill="none" stroke="#000000" stroke-width="1.4"/>
      <path d="M771 22 a6 6 0 0 1 0 12 z" fill="#000000"/>

      <rect x="790" y="16" width="26" height="24" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M790.5 39.5 h25 M814.5 16.5 v24" stroke="#404040" stroke-width="1"/>
      <path d="M791.5 38.5 h24 M813.5 17.5 v22" stroke="#808080" stroke-width="1"/>
      <text x="803" y="33" font-size="12" text-anchor="middle" fill="#000000">世</text>

      <rect x="822" y="16" width="26" height="24" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M822.5 39.5 h25 M846.5 16.5 v24" stroke="#404040" stroke-width="1"/>
      <path d="M823.5 38.5 h24 M845.5 17.5 v22" stroke="#808080" stroke-width="1"/>
      <circle cx="835" cy="24" r="1.6" fill="#000000"/>
      <text x="835" y="36" font-size="12" font-weight="700" text-anchor="middle" fill="#000000">i</text>

      <rect x="854" y="16" width="26" height="24" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
      <path d="M854.5 39.5 h25 M878.5 16.5 v24" stroke="#404040" stroke-width="1"/>
      <path d="M855.5 38.5 h24 M877.5 17.5 v22" stroke="#808080" stroke-width="1"/>
      <circle cx="867" cy="28" r="5" fill="none" stroke="#000000" stroke-width="1.3"/>
      <path d="M867 20 v3 M867 33 v3 M859 28 h3 M872 28 h3 M861.5 21.5 l2 2 M872.5 21.5 l-2 2 M861.5 34.5 l2 -2 M872.5 34.5 l-2 -2" stroke="#000000" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Theme dropdown open, showing "Retro" chosen -->
  <g>
    <rect x="758" y="42" width="118" height="72" fill="#ECE9D8" stroke="#000000" stroke-width="1"/>
    <rect x="759" y="43" width="116" height="70" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="768" y="59" font-size="11" fill="#000000">Light</text>
    <text x="768" y="79" font-size="11" fill="#000000">Dark</text>
    <rect x="759" y="86" width="116" height="20" fill="#316AC5"/>
    <text x="768" y="100" font-size="11" fill="#FFFFFF">Retro (2000s)</text>
  </g>

  <!-- Setup bar (etched groupbox) -->
  <g>
    <rect x="20" y="52" width="940" height="98" fill="#ECE9D8" stroke="#808080" stroke-width="1"/>
    <rect x="21" y="53" width="938" height="96" fill="none" stroke="#FFFFFF" stroke-width="1"/>

    <text x="36" y="78" font-size="11" fill="#000000">Repo:</text>
    <rect x="80" y="65" width="380" height="22" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <rect x="81" y="66" width="378" height="20" fill="none" stroke="#7F9DB9" stroke-width="1"/>
    <text x="90" y="80" font-size="11" fill="#000000">D:\HobbyProjects\coderev-2</text>

    <rect x="468" y="65" width="28" height="22" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M468.5 86.5 h27 M495.5 65.5 v21" stroke="#404040" stroke-width="1"/>
    <path d="M469.5 85.5 h26 M494.5 66.5 v19" stroke="#808080" stroke-width="1"/>
    <path d="M475 81 v-8 h5 l2 -2 h6 v3 h-4 l-2 2 h4" fill="none" stroke="#000000" stroke-width="1.1"/>

    <text x="512" y="78" font-size="11" fill="#000000">Branch:</text>
    <rect x="566" y="65" width="180" height="22" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <rect x="567" y="66" width="178" height="20" fill="none" stroke="#7F9DB9" stroke-width="1"/>
    <text x="576" y="80" font-size="11" fill="#000000">feature/login</text>

    <text x="36" y="113" font-size="11" fill="#000000">Base:</text>
    <rect x="76" y="100" width="130" height="22" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <rect x="77" y="101" width="128" height="20" fill="none" stroke="#7F9DB9" stroke-width="1"/>
    <text x="84" y="115" font-size="10" fill="#000000">origin/main</text>

    <text x="222" y="113" font-size="11" fill="#000000">Agent:</text>
    <rect x="268" y="100" width="110" height="22" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <rect x="269" y="101" width="108" height="20" fill="none" stroke="#7F9DB9" stroke-width="1"/>
    <text x="276" y="115" font-size="10" fill="#000000">claude</text>

    <text x="394" y="113" font-size="11" fill="#000000">Lang:</text>
    <rect x="430" y="100" width="80" height="22" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <rect x="431" y="101" width="78" height="20" fill="none" stroke="#7F9DB9" stroke-width="1"/>
    <text x="438" y="115" font-size="10" fill="#000000">en</text>

    <rect x="528" y="104" width="13" height="13" fill="#FFFFFF" stroke="#404040" stroke-width="1"/>
    <path d="M530 111 l3 3 l6 -7" fill="none" stroke="#000000" stroke-width="1.4"/>
    <text x="546" y="115" font-size="11" fill="#000000">Dry-run</text>

    <rect x="800" y="98" width="140" height="28" fill="#ECE9D8" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M800.5 125.5 h139 M939.5 98.5 v27" stroke="#404040" stroke-width="1.5"/>
    <path d="M802 124 h136 M938 100 v24" stroke="#808080" stroke-width="1"/>
    <path d="M816 106 v14 l12 -7 z" fill="#000000"/>
    <text x="838" y="117" font-size="11" font-weight="700" fill="#000000">Start review</text>
  </g>

  <!-- Steps sidebar -->
  <g>
    <rect x="20" y="164" width="220" height="490" fill="#ECE9D8" stroke="#808080" stroke-width="1"/>
    <rect x="21" y="165" width="218" height="488" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="36" y="190" font-size="11" font-weight="700" fill="#000000">PROGRESS</text>

    <g font-size="11" fill="#000000">
      <rect x="34" y="206" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <path d="M37 214 l3 3 l7 -8" fill="none" stroke="#006600" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="218">Checking repository</text>

      <rect x="34" y="238" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <path d="M37 246 l3 3 l7 -8" fill="none" stroke="#006600" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="250">Fetching base</text>

      <rect x="34" y="270" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <path d="M37 278 l3 3 l7 -8" fill="none" stroke="#006600" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="282">Computing diff</text>
      <text x="60" y="296" font-size="9" fill="#5B5B54">3 files · 8 hunks · 12 KB</text>

      <rect x="34" y="314" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <path d="M37 322 l3 3 l7 -8" fill="none" stroke="#006600" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="326">Building prompt</text>

      <rect x="34" y="346" width="16" height="16" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
      <path d="M42 350 a4 4 0 1 1 -4 4" fill="none" stroke="#316AC5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="60" y="358" fill="#316AC5">AI review (claude)</text>
    </g>
  </g>

  <!-- Tabs, property-sheet style, beveled -->
  <g font-size="11">
    <rect x="256" y="164" width="82" height="30" fill="#316AC5"/>
    <rect x="257" y="165" width="80" height="28" fill="none" stroke="#7FA2E0" stroke-width="1"/>
    <text x="297" y="184" text-anchor="middle" fill="#FFFFFF" font-weight="700">Review</text>

    <rect x="344" y="168" width="62" height="26" fill="#DCD8C8" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M344.5 193.5 h61 M405.5 168.5 v25" stroke="#808080" stroke-width="1"/>
    <text x="375" y="185" text-anchor="middle" fill="#000000">Diff</text>

    <rect x="412" y="168" width="80" height="26" fill="#DCD8C8" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M412.5 193.5 h79 M491.5 168.5 v25" stroke="#808080" stroke-width="1"/>
    <text x="452" y="185" text-anchor="middle" fill="#000000">History</text>

    <rect x="498" y="168" width="60" height="26" fill="#DCD8C8" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M498.5 193.5 h59 M557.5 168.5 v25" stroke="#808080" stroke-width="1"/>
    <text x="528" y="185" text-anchor="middle" fill="#000000">Log</text>
  </g>

  <!-- Review content -->
  <g>
    <rect x="256" y="206" width="684" height="448" fill="#FFFFFF" stroke="#808080" stroke-width="1"/>
    <rect x="257" y="207" width="682" height="446" fill="none" stroke="#FFFFFF" stroke-width="1"/>

    <rect x="272" y="222" width="652" height="70" fill="none" stroke="#ACA899" stroke-width="1"/>
    <rect x="272" y="222" width="652" height="22" fill="#4A6BBF"/>
    <text x="284" y="237" font-size="11" font-weight="700" fill="#FFFFFF">Summary</text>
    <text x="284" y="264" font-size="11" fill="#000000">The login refactor is solid; token handling is clearer and the diff is small.</text>

    <rect x="272" y="302" width="652" height="86" fill="none" stroke="#ACA899" stroke-width="1"/>
    <rect x="272" y="302" width="652" height="22" fill="#BF4A4A"/>
    <text x="284" y="317" font-size="11" font-weight="700" fill="#FFFFFF">Major issues</text>
    <text x="284" y="344" font-size="11" fill="#000000">The</text>
    <rect x="304" y="333" width="58" height="14" fill="#ECE9D8"/>
    <text x="308" y="344" font-size="10" font-family="Courier New, monospace" fill="#000000">getHash</text>
    <text x="366" y="344" font-size="11" fill="#000000">helper doesn't handle the null case — it throws instead of</text>
    <text x="284" y="362" font-size="11" fill="#000000">returning empty.</text>

    <rect x="272" y="398" width="652" height="70" fill="none" stroke="#ACA899" stroke-width="1"/>
    <rect x="272" y="398" width="652" height="22" fill="#4E9A5B"/>
    <text x="284" y="413" font-size="11" font-weight="700" fill="#FFFFFF">Suggestions</text>
    <text x="284" y="440" font-size="11" fill="#000000">Add a unit test for the empty-token path so the regression can't return.</text>
  </g>

  <!-- Status bar, sunken -->
  <g>
    <rect x="20" y="664" width="940" height="26" fill="#ECE9D8" stroke="#808080" stroke-width="1"/>
    <rect x="21" y="665" width="938" height="24" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="20" y="664" width="700" height="26" fill="none" stroke="#ACA899" stroke-width="1"/>
    <circle cx="38" cy="677" r="6" fill="none" stroke="#006600" stroke-width="1.3"/>
    <path d="M35 677 l2 2 l4 -5" fill="none" stroke="#006600" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="681" font-size="10" fill="#000000">Review: feature/login · base origin/main</text>
    <text x="944" y="681" font-size="10" fill="#000000" text-anchor="end">coderev Desktop v1.4.0</text>
  </g>
</svg>
