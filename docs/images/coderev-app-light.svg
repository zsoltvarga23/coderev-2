<svg width="980" height="700" viewBox="0 0 980 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>coderev Desktop — Review tab, light theme</title>
  <desc>Illustration of the coderev desktop application showing the setup bar, the live step tracker, and a color-coded AI review with Summary, Major issues and Suggestions cards.</desc>

  <rect x="0" y="0" width="980" height="700" rx="10" fill="#F6F6F4"/>
  <rect x="0.5" y="0.5" width="979" height="699" rx="10" fill="none" stroke="#D9D8D3" stroke-width="1"/>

  <!-- Header -->
  <g>
    <path d="M28 24 h5 l7 12 h-5 z M31 20 l9 4 l-4 9 l-9 -4 z" fill="#2DA44E"/>
    <text x="52" y="34" font-size="15" font-weight="600" fill="#1F2328">coderev</text>

    <g fill="#5B6169">
      <circle cx="742" cy="28" r="13" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <path d="M736 28 h12 M742 22 v12" stroke="#5B6169" stroke-width="1.4"/>
      <circle cx="786" cy="28" r="13" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <path d="M786 21 v14 M779 28 h14" stroke="#5B6169" stroke-width="1.4" transform="rotate(45 786 28)"/>
      <circle cx="830" cy="28" r="13" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <text x="830" y="33" font-size="14" text-anchor="middle" fill="#5B6169">a</text>
      <circle cx="874" cy="28" r="13" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <text x="874" y="33" font-size="14" text-anchor="middle" font-style="italic" font-weight="700" fill="#5B6169">i</text>
      <circle cx="918" cy="28" r="13" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <circle cx="918" cy="28" r="4" fill="none" stroke="#5B6169" stroke-width="1.4"/>
      <path d="M918 20 v3 M918 33 v3 M910 28 h3 M923 28 h3" stroke="#5B6169" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Setup bar -->
  <g>
    <rect x="20" y="52" width="940" height="98" rx="8" fill="#FFFFFF" stroke="#E3E2DD" stroke-width="1"/>

    <text x="36" y="78" font-size="12" fill="#5B6169">Repo:</text>
    <rect x="80" y="65" width="380" height="26" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <text x="92" y="82" font-size="12" fill="#1F2328">D:\HobbyProjects\coderev-2</text>
    <rect x="468" y="65" width="30" height="26" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <path d="M476 82 v-9 h5 l3 -3 h6 v3 h-4 l-3 3 h5" fill="none" stroke="#5B6169" stroke-width="1.3"/>

    <text x="512" y="78" font-size="12" fill="#5B6169">Branch:</text>
    <rect x="566" y="65" width="180" height="26" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <text x="578" y="82" font-size="12" fill="#1F2328">feature/login</text>

    <text x="36" y="115" font-size="12" fill="#5B6169">Base:</text>
    <rect x="76" y="102" width="130" height="24" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <text x="86" y="118" font-size="11" fill="#1F2328">origin/main</text>

    <text x="222" y="115" font-size="12" fill="#5B6169">Agent:</text>
    <rect x="268" y="102" width="110" height="24" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <text x="278" y="118" font-size="11" fill="#1F2328">claude</text>

    <text x="394" y="115" font-size="12" fill="#5B6169">Lang:</text>
    <rect x="432" y="102" width="80" height="24" rx="6" fill="#F6F6F4" stroke="#DADAD5" stroke-width="1"/>
    <text x="442" y="118" font-size="11" fill="#1F2328">en</text>

    <rect x="530" y="106" width="34" height="16" rx="8" fill="#DADAD5"/>
    <circle cx="538" cy="114" r="6" fill="#FFFFFF"/>
    <text x="570" y="118" font-size="11" fill="#5B6169">Dry-run</text>

    <rect x="800" y="100" width="140" height="30" rx="8" fill="#2DA44E"/>
    <path d="M818 108 v14 l12 -7 z" fill="#FFFFFF"/>
    <text x="840" y="119" font-size="12" font-weight="600" fill="#FFFFFF">Start review</text>
  </g>

  <!-- Steps sidebar -->
  <g>
    <rect x="20" y="164" width="220" height="490" rx="8" fill="#FFFFFF" stroke="#E3E2DD" stroke-width="1"/>
    <text x="36" y="190" font-size="11" font-weight="600" fill="#8A8F98" letter-spacing="0.5">PROGRESS</text>

    <g font-size="12" fill="#1F2328">
      <circle cx="42" cy="214" r="8" fill="none" stroke="#2DA44E" stroke-width="1.6"/>
      <path d="M38 214 l3 3 l6 -7" fill="none" stroke="#2DA44E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="218">Checking repository</text>

      <circle cx="42" cy="246" r="8" fill="none" stroke="#2DA44E" stroke-width="1.6"/>
      <path d="M38 246 l3 3 l6 -7" fill="none" stroke="#2DA44E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="250">Fetching base</text>

      <circle cx="42" cy="278" r="8" fill="none" stroke="#2DA44E" stroke-width="1.6"/>
      <path d="M38 278 l3 3 l6 -7" fill="none" stroke="#2DA44E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="282">Computing diff</text>
      <text x="60" y="296" font-size="10" fill="#8A8F98">3 files · 8 hunks · 12 KB</text>

      <circle cx="42" cy="322" r="8" fill="none" stroke="#2DA44E" stroke-width="1.6"/>
      <path d="M38 322 l3 3 l6 -7" fill="none" stroke="#2DA44E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="326">Building prompt</text>

      <circle cx="42" cy="354" r="8" fill="none" stroke="#378ADD" stroke-width="1.6"/>
      <path d="M42 350 a4 4 0 1 1 -4 4" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round"/>
      <text x="60" y="358" fill="#378ADD">AI review (claude)</text>
    </g>
  </g>

  <!-- Tabs -->
  <g font-size="12">
    <rect x="256" y="164" width="82" height="30" rx="8" fill="#2DA44E"/>
    <text x="297" y="184" text-anchor="middle" fill="#FFFFFF" font-weight="600">Review</text>
    <rect x="344" y="164" width="62" height="30" rx="8" fill="#EEEEEA"/>
    <text x="375" y="184" text-anchor="middle" fill="#5B6169">Diff</text>
    <rect x="412" y="164" width="80" height="30" rx="8" fill="#EEEEEA"/>
    <text x="452" y="184" text-anchor="middle" fill="#5B6169">History</text>
    <rect x="498" y="164" width="60" height="30" rx="8" fill="#EEEEEA"/>
    <text x="528" y="184" text-anchor="middle" fill="#5B6169">Log</text>
  </g>

  <!-- Review content -->
  <g>
    <rect x="256" y="206" width="684" height="448" rx="8" fill="#FFFFFF" stroke="#E3E2DD" stroke-width="1"/>

    <rect x="272" y="222" width="652" height="70" rx="6" fill="none" stroke="#E3E2DD" stroke-width="1"/>
    <rect x="272" y="222" width="652" height="26" rx="6" fill="#3B82F6"/>
    <rect x="272" y="240" width="652" height="8" fill="#3B82F6"/>
    <text x="284" y="240" font-size="12" font-weight="600" fill="#FFFFFF">Summary</text>
    <text x="284" y="268" font-size="12" fill="#1F2328">The login refactor is solid; token handling is clearer and the diff is small.</text>

    <rect x="272" y="302" width="652" height="86" rx="6" fill="none" stroke="#E3E2DD" stroke-width="1"/>
    <rect x="272" y="302" width="652" height="26" rx="6" fill="#EF4444"/>
    <rect x="272" y="320" width="652" height="8" fill="#EF4444"/>
    <text x="284" y="320" font-size="12" font-weight="600" fill="#FFFFFF">Major issues</text>
    <text x="284" y="348" font-size="12" fill="#1F2328">The</text>
    <rect x="308" y="337" width="58" height="16" rx="3" fill="#F6F6F4"/>
    <text x="313" y="349" font-size="11" font-family="Consolas, monospace" fill="#1F2328">getHash</text>
    <text x="370" y="348" font-size="12" fill="#1F2328">helper doesn't handle the null case — it throws instead of</text>
    <text x="284" y="366" font-size="12" fill="#1F2328">returning empty.</text>

    <rect x="272" y="398" width="652" height="70" rx="6" fill="none" stroke="#E3E2DD" stroke-width="1"/>
    <rect x="272" y="398" width="652" height="26" rx="6" fill="#10B981"/>
    <rect x="272" y="416" width="652" height="8" fill="#10B981"/>
    <text x="284" y="416" font-size="12" font-weight="600" fill="#FFFFFF">Suggestions</text>
    <text x="284" y="444" font-size="12" fill="#1F2328">Add a unit test for the empty-token path so the regression can't return.</text>
  </g>

  <!-- Status bar -->
  <g>
    <rect x="20" y="664" width="940" height="26" rx="8" fill="#FFFFFF" stroke="#E3E2DD" stroke-width="1"/>
    <circle cx="38" cy="677" r="6" fill="none" stroke="#2DA44E" stroke-width="1.4"/>
    <path d="M35 677 l2 2 l4 -5" fill="none" stroke="#2DA44E" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="681" font-size="11" fill="#5B6169">Review: feature/login · base origin/main</text>
    <text x="944" y="681" font-size="11" fill="#8A8F98" text-anchor="end">coderev Desktop v1.4.0</text>
  </g>
</svg>
